# Ejecuta la validación completa en cada PR y en cada merge a main.
# Gratis en repositorios públicos (runners estándar de GitHub). Docker viene en ubuntu-latest (Testcontainers).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Tests unitarios, integración (Testcontainers) y cobertura
        run: ./mvnw -B verify
